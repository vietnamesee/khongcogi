<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscordRPC - Quản lý Tokens</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #11111f;
            --text-primary: #ffffff;
            --text-secondary: #b5bac1;
            --text-muted: #6d7278;
            --brand: #5865f2;
            --brand-hover: #4752c4;
            --brand-gradient: linear-gradient(135deg, #5865f2, #7289da);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --transition: all 0.3s ease;
        }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--brand);
            border-radius: 10px;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: var(--transition);
        }
        .glass:hover {
            transform: translateY(-6px);
            border-color: rgba(88, 101, 242, 0.4);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--brand-gradient);
            color: white;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(88, 101, 242, 0.3);
        }
        .btn-primary:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 32px rgba(88, 101, 242, 0.5);
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            transform: scale(1.05) translateY(-2px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
        }
        .gradient-text {
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 6s ease-in-out infinite;
            background-size: 200% 200%;
        }

        .particle-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: float var(--duration, 15s) ease-in-out var(--delay, 0s) infinite normal none running;
        }

        .sidebar-desktop {
            width: 240px;
            min-height: 100vh;
            background: rgba(0, 0, 0, 0.4);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            padding: 20px 12px;
            position: fixed;
            top: 0;
            left: -240px;
            bottom: 0;
            z-index: 50;
            transition: left 0.3s;
            backdrop-filter: blur(20px);
        }
        .sidebar-desktop.open {
            left: 0;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            margin-bottom: 20px;
        }
        .sidebar-logo-icon {
            width: 32px;
            height: 32px;
            background: var(--brand-gradient);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .sidebar-logo span {
            font-weight: 800;
            font-size: 16px;
            color: white;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.06);
            color: white;
        }
        .sidebar-item.active {
            background: rgba(88, 101, 242, 0.15);
            color: white;
            border-color: rgba(88, 101, 242, 0.3);
        }
        .sidebar-item svg {
            flex-shrink: 0;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 2px;
            flex: 1;
        }
        .sidebar-menu-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 0 12px;
            margin-bottom: 8px;
        }

        .sidebar-token-status {
            padding: 12px;
            margin-bottom: 8px;
            background: rgba(254, 231, 92, 0.08);
            border: 1px solid rgba(254, 231, 92, 0.2);
            border-radius: 10px;
            font-size: 12px;
        }
        .sidebar-token-status .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .sidebar-token-status .status-dot.pending {
            background: #fee75c;
        }
        .sidebar-token-status span {
            font-weight: 600;
            color: #fee75c;
        }
        .sidebar-token-status p {
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.5;
            margin-top: 4px;
        }

        .sidebar-user {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            border-top: 1px solid var(--glass-border);
            margin-top: 4px;
        }
        .sidebar-user img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid rgba(88, 101, 242, 0.4);
            flex-shrink: 0;
        }
        .sidebar-user .user-name {
            font-weight: 600;
            font-size: 13px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .sidebar-user .user-tag {
            font-size: 11px;
            color: var(--text-muted);
        }
        .sidebar-user .user-info {
            flex: 1;
            min-width: 0;
        }
        .sidebar-user button {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px;
            border-radius: 6px;
            transition: color 0.2s;
        }
        .sidebar-user button:hover {
            color: #ed4245;
        }

        .dashboard-main {
            margin-left: 0;
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 1;
        }

        .dashboard-header {
            height: 64px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            padding: 0 24px;
            background: rgba(7, 7, 13, 0.75);
            backdrop-filter: blur(16px);
            position: sticky;
            top: 0;
            z-index: 30;
            justify-content: space-between;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
        }
        .header-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
        }
        .header-breadcrumb a {
            color: var(--text-muted);
        }
        .header-breadcrumb .current {
            color: white;
            font-weight: 600;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .lang-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }
        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 4px 12px 4px 4px;
            cursor: pointer;
        }
        .user-profile img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid rgba(88, 101, 242, 0.4);
        }
        .user-profile .profile-name {
            font-size: 13px;
            font-weight: 700;
            color: white;
            line-height: 1.2;
        }
        .user-profile .profile-status {
            font-size: 10px;
            color: #57f287;
            font-weight: 600;
        }

        .dashboard-content {
            flex: 1;
            padding: 28px;
            max-width: 1200px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin: 0;
        }
        .page-header .page-sub {
            color: var(--text-secondary);
            font-size: 14px;
        }
        .page-header .header-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .empty-state {
            padding: 60px;
            text-align: center;
        }
        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .empty-state h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .empty-state p {
            color: var(--text-secondary);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 18, 0.95);
            backdrop-filter: blur(16px);
            border-top: 1px solid var(--glass-border);
            padding: 8px 0 env(safe-area-inset-bottom, 8px);
            z-index: 40;
            justify-content: space-around;
        }
        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 4px 12px;
            color: var(--text-muted);
            font-size: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .mobile-nav-item.active {
            color: var(--brand);
        }
        .mobile-nav-item svg {
            width: 18px;
            height: 18px;
        }

        @media (min-width: 769px) {
            .sidebar-desktop {
                left: 0 !important;
            }
            .dashboard-main {
                margin-left: 240px !important;
            }
            #mobileMenuBtn {
                display: none !important;
            }
        }

        @media (max-width: 768px) {
            .sidebar-desktop {
                left: -240px !important;
            }
            .sidebar-desktop.open {
                left: 0 !important;
            }
            .dashboard-main {
                margin-left: 0 !important;
            }
            #mobileMenuBtn {
                display: flex !important;
            }
            .dashboard-content {
                padding: 16px 14px 80px 14px !important;
            }
            .mobile-bottom-nav {
                display: flex !important;
            }
            .page-header {
                flex-direction: column;
            }
            .user-profile .profile-status {
                display: none;
            }
            .header-right .premium-btn {
                font-size: 10px;
                padding: 4px 10px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animated" style="min-height:100vh;display:flex;">
        <div class="particle-container" id="particles"></div>

        <!-- SIDEBAR -->
        <aside class="sidebar-desktop" id="sidebar">
            <a href="/" class="sidebar-logo">
                <div class="sidebar-logo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <line x1="6" y1="12" x2="10" y2="12"></line>
                        <line x1="8" y1="10" x2="8" y2="14"></line>
                        <circle cx="15" cy="13" r="1" fill="white"></circle>
                        <circle cx="17" cy="11" r="1" fill="white"></circle>
                        <path d="M17.5 4h-11A5.5 5.5 0 0 0 1 9.5v3A5.5 5.5 0 0 0 6.5 18H8l2 3h4l2-3h1.5a5.5 5.5
