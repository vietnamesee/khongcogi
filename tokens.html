<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscordRPC - Đăng nhập</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #11111f;
            --text-primary: #ffffff;
            --text-secondary: #b5bac1;
            --text-muted: #6d7278;
            --brand: #5865f2;
            --brand-hover: #4752c4;
            --brand-gradient: linear-gradient(135deg, #5865f2, #7289da);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.08);
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --transition: all 0.3s ease;
        }
        body {
            font-family: var(--font);
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        .glass {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: var(--transition);
        }
        .glass:hover {
            transform: translateY(-6px);
            border-color: rgba(88, 101, 242, 0.4);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--brand-gradient);
            color: white;
            border: none;
            border-radius: 100px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 16px rgba(88, 101, 242, 0.3);
        }
        .btn-primary:hover {
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 32px rgba(88, 101, 242, 0.5);
        }
        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.06);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 100px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-secondary:hover {
            transform: scale(1.05) translateY(-2px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 13px;
        }
        .gradient-text {
            background: var(--brand-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: gradientMove 6s ease-in-out infinite;
            background-size: 200% 200%;
        }

        .particle-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: float var(--duration, 15s) ease-in-out var(--delay, 0s) infinite normal none running;
        }

        .login-container {
            max-width: 420px;
            width: 100%;
            padding: 40px;
            text-align: center;
            position: relative;
            z-index: 1;
            animation: fadeInUp 0.5s ease;
        }
        .login-container:hover {
            transform: none !important;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .login-logo {
            margin-bottom: 24px;
        }
        .login-logo-icon {
            width: 56px;
            height: 56px;
            background: var(--brand-gradient);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            transition: all 0.5s ease;
        }
        .login-logo-icon:hover {
            transform: rotate(-10deg) scale(1.1);
        }

        .input-field {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            transition: all 0.3s ease;
            outline: none;
            text-align: center;
        }
        .input-field:focus {
            border-color: var(--brand);
            box-shadow: 0 0 0 3px rgba(88, 101, 242, 0.2);
        }
        .input-field::placeholder {
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 28px 20px !important;
                margin: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-animated" style="min-height:100vh;display:flex;align-items:center;justify-content:center;">
        <div class="particle-container" id="particles"></div>

        <div class="glass login-container">
            <div class="login-logo">
                <div class="login-logo-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <line x1="6" y1="12" x2="10" y2="12"></line>
                        <line x1="8" y1="10" x2="8" y2="14"></line>
                        <circle cx="15" cy="13" r="1" fill="white"></circle>
                        <circle cx="17" cy="11" r="1" fill="white"></circle>
                        <path d="M17.5 4h-11A5.5 5.5 0 0 0 1 9.5v3A5.5 5.5 0 0 0 6.5 18H8l2 3h4l2-3h1.5a5.5 5.5 0 0 0 5.5-5.5v-3A5.5 5.5 0 0 0 17.5 4z"></path>
                    </svg>
                </div>
                <h2 style="font-size:22px;font-weight:800;letter-spacing:-0.02em;">Đăng nhập vào <span class="gradient-text">DiscordRPC</span></h2>
                <p style="color:var(--text-secondary);font-size:14px;margin-top:4px;">Chọn cách đăng nhập của bạn</p>
            </div>

            <div style="display:flex;flex-direction:column;gap:12px;">
                <a class="btn-primary" href="/dashboard" style="padding:14px;font-size:16px;justify-content:center;width:100%;">
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057.1 18.082.114 18.104.132 18.12a19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"></path>
                    </svg>
                    Đăng nhập với Discord
                </a>

                <div style="display:flex;align-items:center;gap:12px;margin:8px 0;">
                    <hr style="flex:1;border-color:var(--glass-border);">
                    <span style="color:var(--text-muted);font-size:12px;font-weight:600;">HOẶC</span>
                    <hr style="flex:1;border-color:var(--glass-border);">
                </div>

                <form id="tokenLoginForm" style="display:flex;flex-direction:column;gap:12px;">
                    <input class="input-field" type="password" id="tokenInput" placeholder="Nhập Discord User Token của bạn...">
                    <button type="submit" class="btn-secondary" style="padding:12px;font-size:15px;justify-content:center;width:100%;">
                        🔑 Đăng nhập bằng Token
                    </button>
                </form>
            </div>

            <p style="color:var(--text-muted);font-size:12px;margin-top:20px;line-height:1.5;">
                ⚠️ Sử dụng user token có thể vi phạm Discord ToS.<br>
                Bạn tự chịu trách nhiệm khi sử dụng.
            </p>
        </div>

        <script>
            // PARTICLES
            (function() {
                const c = document.getElementById('particles');
                if (!c) return;
                for (let i = 0; i < 30; i++) {
                    const p = document.createElement('div');
                    p.className = 'particle';
                    const s = 0.8 + Math.random() * 3;
                    p.style.width = s + 'px';
                    p.style.height = s + 'px';
                    p.style.background = `rgba(88, 101, 242, ${0.2 + Math.random() * 0.5})`;
                    p.style.left = Math.random() * 100 + '%';
                    p.style.top = Math.random() * 100 + '%';
                    p.style.setProperty('--duration', (10 + Math.random() * 10) + 's');
                    p.style.setProperty('--delay', (Math.random() * 5) + 's');
                    c.appendChild(p);
                }
            })();

            // TOKEN LOGIN
            document.getElementById('tokenLoginForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const token = document.getElementById('tokenInput').value.trim();
                if (!token) {
                    alert('Vui lòng nhập token!');
                    return;
                }
                if (token.length < 20) {
                    alert('Token không hợp lệ!');
                    return;
                }
                // Lưu token vào localStorage và chuyển hướng
                localStorage.setItem('discord_token', token);
                window.location.href = '/dashboard';
            });
        </script>
    </div>
</body>
</html>
