<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh sách Token</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a12;
            color: white;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { font-size: 24px; font-weight: 800; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .btn-primary {
            background: linear-gradient(135deg, #5865f2, #7289da);
            color: white;
            box-shadow: 0 4px 16px rgba(88,101,242,0.3);
        }
        .btn-primary:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 32px rgba(88,101,242,0.5);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }
        .btn-danger {
            background: rgba(237,66,69,0.15);
            color: #ed4245;
            border: 1px solid rgba(237,66,69,0.2);
            padding: 6px 12px;
            font-size: 12px;
        }
        .btn-danger:hover { background: rgba(237,66,69,0.25); }
        .card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px;
        }
        .token-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            gap: 12px;
            flex-wrap: wrap;
        }
        .token-item:last-child { border-bottom: none; }
        .token-item .info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        .token-item .info .icon {
            width: 32px;
            height: 32px;
            background: rgba(88,101,242,0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .token-item .info .name {
            font-weight: 600;
            font-size: 14px;
        }
        .token-item .info .token-text {
            font-size: 12px;
            color: #6d7278;
            font-family: monospace;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 150px;
        }
        .token-item .info .time {
            font-size: 11px;
            color: #6d7278;
        }
        .token-item .status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            flex-shrink: 0;
        }
        .token-item .status.active {
            background: rgba(87,242,135,0.15);
            color: #57f287;
            border: 1px solid rgba(87,242,135,0.2);
        }
        .token-item .status.inactive {
            background: rgba(237,66,69,0.15);
            color: #ed4245;
            border: 1px solid rgba(237,66,69,0.2);
        }
        .empty {
            text-align: center;
            padding: 40px 20px;
        }
        .empty .icon { font-size: 48px; margin-bottom: 16px; }
        .empty h3 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
        .empty p { color: #b5bac1; margin-bottom: 20px; }
        .count {
            font-size: 14px;
            color: #6d7278;
        }
        .count strong { color: white; }
        .actions { display: flex; gap: 6px; }
        .refresh {
            background: none;
            border: none;
            color: #6d7278;
            cursor: pointer;
            font-size: 18px;
            padding: 4px 8px;
            transition: all 0.3s ease;
        }
        .refresh:hover { color: white; transform: rotate(180deg); }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show { opacity: 1; pointer-events: auto; }
        .toast.success {
            background: rgba(87,242,135,0.15);
            border: 1px solid rgba(87,242,135,0.3);
            color: #57f287;
        }
        .toast.error {
            background: rgba(237,66,69,0.15);
            border: 1px solid rgba(237,66,69,0.3);
            color: #ed4245;
        }
        @media (max-width: 600px) {
            .token-item { flex-direction: column; align-items: stretch; }
            .token-item .info { flex-wrap: wrap; }
            .token-item .info .token-text { max-width: 100%; }
            .token-item .actions { justify-content: flex-end; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h1>🔑 Danh sách Token</h1>
                <div class="count">Tổng: <strong id="tokenCount">0</strong> token</div>
            </div>
            <div style="display:flex;gap:8px;">
                <button class="refresh" onclick="loadTokens()" title="Làm mới">🔄</button>
                <a href="/login" class="btn btn-primary">➕ Thêm</a>
            </div>
        </div>

        <div class="card" id="listContainer">
            <div id="tokenList">
                <div class="empty">
                    <div class="icon">🔑</div>
                    <h3>Chưa có Token nào</h3>
                    <p>Thêm token đầu tiên của bạn</p>
                    <a href="/login" class="btn btn-primary">➕ Thêm Token ngay</a>
                </div>
            </div>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        async function loadTokens() {
            try {
                const res = await fetch('/api/tokens');
                const data = await res.json();
                const tokens = data.tokens || [];
                const container = document.getElementById('tokenList');
                document.getElementById('tokenCount').textContent = tokens.length;

                if (tokens.length === 0) {
                    container.innerHTML = `
                        <div class="empty">
                            <div class="icon">🔑</div>
                            <h3>Chưa có Token nào</h3>
                            <p>Thêm token đầu tiên của bạn</p>
                            <a href="/login" class="btn btn-primary">➕ Thêm Token ngay</a>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = tokens.map(t => `
                    <div class="token-item">
                        <div class="info">
                            <div class="icon">🔑</div>
                            <div>
                                <div class="name">${t.name || 'Tài khoản'}</div>
                                <div class="token-text">${t.token}</div>
                                <div class="time">${t.createdAt || ''}</div>
                            </div>
                        </div>
                        <div class="status ${t.status === 'active' ? 'active' : 'inactive'}">
                            ${t.status === 'active' ? '🟢 Hoạt động' : '🔴 Không hoạt động'}
                        </div>
                        <div class="actions">
                            <button class="btn btn-danger" onclick="deleteToken('${t.id}')">🗑️</button>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Lỗi:', error);
                showToast('Không thể tải danh sách token!', 'error');
            }
        }

        async function deleteToken(id) {
            if (!confirm('Bạn có chắc muốn xóa token này?')) return;

            try {
                const res = await fetch(`/api/tokens/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    showToast('Xóa thành công!', 'success');
                    loadTokens();
                } else {
                    showToast('Lỗi xóa!', 'error');
                }
            } catch (error) {
                showToast('Lỗi kết nối!', 'error');
            }
        }

        // Load lần đầu và refresh mỗi 5s
        document.addEventListener('DOMContentLoaded', loadTokens);
        setInterval(loadTokens, 5000);
    </script>
</body>
</html>
