<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm Token</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a12;
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .box:hover { border-color: rgba(88,101,242,0.3); }
        .logo {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h2 { font-size: 22px; font-weight: 800; margin-bottom: 4px; }
        .sub { color: #b5bac1; font-size: 14px; margin-bottom: 24px; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus {
            border-color: #5865f2;
            box-shadow: 0 0 0 3px rgba(88,101,242,0.2);
        }
        input::placeholder { color: #6d7278; }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            border-radius: 100px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
            margin-top: 12px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #5865f2, #7289da);
            color: white;
            box-shadow: 0 4px 16px rgba(88,101,242,0.3);
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 32px rgba(88,101,242,0.5);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            color: white;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.12); }
        .links {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .links a {
            color: #5865f2;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }
        .links a:hover { text-decoration: underline; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }
        .toast.show { opacity: 1; pointer-events: auto; }
        .toast.success {
            background: rgba(87,242,135,0.15);
            border: 1px solid rgba(87,242,135,0.3);
            color: #57f287;
        }
        .toast.error {
            background: rgba(237,66,69,0.15);
            border: 1px solid rgba(237,66,69,0.3);
            color: #ed4245;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="logo">🔑</div>
        <h2>Thêm Token</h2>
        <p class="sub">Nhập Discord User Token của bạn</p>

        <form id="form">
            <input type="password" id="tokenInput" placeholder="Nhập token..." required>
            <button type="submit" class="btn btn-primary" id="submitBtn">➕ Thêm Token</button>
        </form>

        <div class="links">
            <a href="/tokens">📋 Danh sách token</a>
            <a href="/dashboard">📊 Dashboard</a>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        document.getElementById('form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const token = document.getElementById('tokenInput').value.trim();
            const btn = document.getElementById('submitBtn');

            if (!token) {
                showToast('Vui lòng nhập token!', 'error');
                return;
            }

            btn.disabled = true;
            btn.textContent = '⏳ Đang xử lý...';

            try {
                const res = await fetch('/api/tokens/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });

                const data = await res.json();

                if (data.success) {
                    showToast('✅ Thêm token thành công!', 'success');
                    document.getElementById('tokenInput').value = '';
                    document.getElementById('tokenInput').focus();
                } else {
                    showToast(data.message || 'Lỗi!', 'error');
                }
            } catch (error) {
                showToast('Lỗi kết nối server!', 'error');
            }

            btn.disabled = false;
            btn.textContent = '➕ Thêm Token';
        });
    </script>
</body>
</html>
